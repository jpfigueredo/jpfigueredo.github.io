# Weekly dependency advisory report for develop.
#
# PR CI (ci.yml) only fails on advisories a PR introduces. This run checks
# develop in absolute mode: it fails on every advisory in yarn.lock or
# services/rust-api/Cargo.lock that security/advisory-allowlist.json does not
# accept, and on allowlist entries that expired. It also catches advisories
# published after the code was merged. The full table goes to the job
# summary; a failed scheduled run notifies by GitHub's usual workflow
# notifications. Red is expected until the existing advisories are fixed or
# accepted.
#
# Security model: runs only the code already on develop, with a read-only
# GITHUB_TOKEN, no secrets, no cache, no artifacts, no issue or PR writes.
# Network: api.osv.dev only (see scripts/advisory-gate.mjs).

name: Advisories (weekly)

on:
  schedule:
    # Monday 10:00 UTC, an hour after Dependabot's weekly run.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  develop-absolute:
    name: develop (absolute)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always develop, also when started by hand from another branch.
          ref: develop
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Dependency advisories (absolute)
        run: |
          git log -1 --format='develop: %H %s' HEAD
          node --version
          sha256sum scripts/advisory-gate.mjs
          node scripts/advisory-gate.mjs --mode absolute --head HEAD
