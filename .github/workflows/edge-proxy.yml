# Deploys services/edge-proxy (Cloudflare Worker).
#
# Wrangler comes from yarn.lock (the edge-proxy workspace devDependency),
# installed with lifecycle scripts off, so the deploy uses the exact version
# and tarball hash recorded in the lockfile. The Cloudflare secrets come from
# the `cloudflare` environment and are only present in the steps that need
# them.

name: Deploy Cloudflare Worker (edge-proxy)

on:
  push:
    branches: [main]
    paths:
      - 'services/edge-proxy/**'
      # Wrangler and Node come from these, so a change here redeploys.
      - 'yarn.lock'
      - 'package.json'
      - '.nvmrc'
      - 'scripts/check-lockfile-sync.mjs'
      - '.github/workflows/edge-proxy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: edge-proxy-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Every wrangler command in this workflow, including the ones that hold the
# Cloudflare token: no usage metrics (wrangler.toml also sets send_metrics),
# and no banner, which also skips the banner's update check (a request to the
# npm registry). wrangler still queries the npm registry, without the token,
# on some error paths (to suggest a newer version).
env:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_HIDE_BANNER: "true"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The Cloudflare secrets live in this environment (its deployment policy
    # must allow the main branch only).
    environment: cloudflare
    steps:
      - name: Only deploy from main
        # Backs up the environment policy, and stops a
        # manual run on another branch before any secret is read.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run only from refs/heads/main, this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache on purpose (deploy job with a deploy token).

      - name: Toolchain versions
        run: |
          node --version
          yarn --version
          # The repo is yarn 1 only (packageManager: yarn@1.22.22).
          case "$(yarn --version)" in
            1.*) ;;
            *) echo "::error::yarn 1.x required (packageManager: yarn@1.22.22), got $(yarn --version)"; exit 1 ;;
          esac

      - name: Check package.json files against yarn.lock
        run: node scripts/check-lockfile-sync.mjs

      - name: Install dependencies (from yarn.lock, no lifecycle scripts)
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Check installed wrangler against yarn.lock
        # Fails if the wrangler that Node resolves from services/edge-proxy
        # is not the version yarn.lock pins, then prints that version.
        run: |
          node scripts/check-lockfile-sync.mjs --installed services/edge-proxy --include-dev
          yarn -s workspace edge-proxy wrangler --version

      - name: Check deploy settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_HOST: ${{ vars.BFF_HOST }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          test -n "$BFF_HOST" || { echo "::error::variable BFF_HOST is not set"; exit 1; }

      - name: Publish worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BFF_HOST: ${{ vars.BFF_HOST }}
        # `yarn workspace` runs wrangler from services/edge-proxy, where
        # wrangler.toml lives.
        run: yarn workspace edge-proxy wrangler deploy --var "BFF_HOST:${BFF_HOST}"
