name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Install Angular deps
        run: cd apps/angular-demo && npm install
      - name: Build
        run: yarn build
      - name: Compose Pages artifact
        run: |
          mkdir -p .pages
          # Copy web dist (main site) - this is the root
          cp -r web/dist/* .pages/
          # Create apps directory for sub-apps
          mkdir -p .pages/apps
          # Copy sub-apps if they exist
          if [ -d "apps" ] && [ "$(ls -A apps 2>/dev/null)" ]; then
            for app_dir in apps/*/; do
              if [ -d "${app_dir}dist" ]; then
                app_name=$(basename "${app_dir}")
                mkdir -p ".pages/apps/${app_name}"
                cp -r "${app_dir}dist"/* ".pages/apps/${app_name}/" || true
              fi
            done
          fi
          # Add SPA routing support (404.html = index.html for client-side routing)
          if [ -f ".pages/index.html" ]; then
            cp .pages/index.html .pages/404.html
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
