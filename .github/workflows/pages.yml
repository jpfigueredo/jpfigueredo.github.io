name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Install Angular deps
        run: cd apps/angular-demo && npm install
      - name: Build
        run: yarn build
      - name: Compose Pages artifact
        run: bash scripts/compose-pages.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
