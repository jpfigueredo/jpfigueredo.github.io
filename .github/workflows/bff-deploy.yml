name: Deploy BFF API to Render

on:
  push:
    branches: [main]
    paths:
      - 'services/bff-api/**'
      # The Render build installs from the root lockfile and checks it with
      # this script; Node comes from .nvmrc.
      - 'yarn.lock'
      - 'package.json'
      - '.nvmrc'
      - 'scripts/check-lockfile-sync.mjs'
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    # The hook URL is a secret of this environment (its deployment policy
    # must allow the main branch only).
    environment: render
    steps:
      - name: Only deploy from main
        # Backs up the environment policy, and stops a
        # manual run on another branch before any secret is read.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run only from refs/heads/main, this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_BFF_HOOK: ${{ secrets.RENDER_BFF_HOOK }}
        run: |
          test -n "$RENDER_BFF_HOOK" || { echo "::error::RENDER_BFF_HOOK is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_BFF_HOOK"
