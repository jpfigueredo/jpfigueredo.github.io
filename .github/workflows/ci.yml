# Pull request checks.
#   node-checks: a dependency advisory gate (OSV, yarn.lock and Cargo.lock),
#                a minimum age (7 days) for every new lockfile entry,
#                a guard against copies of the Ohara seed or schema,
#                typecheck, tests (incl. seed-vs-schema validation), a guard
#                against an empty or skipped test suite, lint and build.
#   rust-checks: cargo fmt, clippy and tests for services/rust-api (clippy
#                and tests --locked to Cargo.lock), a guard against an empty
#                or skipped Rust test suite, and a docker build + smoke run of
#                its Dockerfile (the image Render builds), after checking that
#                the rust image tag, the Dockerfile's expected rustc and
#                RUSTUP_TOOLCHAIN agree. It always reports a
#                result (so it can be a required check), but only compiles
#                when the PR touches Rust; otherwise it passes in seconds.
#
# Security model: a PR (including one from a fork) runs untrusted code here
# (install, lint, tests). So this workflow:
#   - triggers only on `pull_request` (never `pull_request_target`/`workflow_run`);
#   - gets a read-only GITHUB_TOKEN, uses no secrets and no OIDC token;
#   - does not persist git credentials after checkout;
#   - restores and saves no cache (nothing a PR writes can reach another run);
#   - installs with `--ignore-scripts` (no lifecycle scripts) and without
#     `--frozen-lockfile`, then fails if the install changed yarn.lock in any
#     way (so a missing, drifted or dead lockfile entry turns the PR red);
#     the production deploys install with `--frozen-lockfile` instead;
#   - pins every action to a full commit SHA;
#   - is independent from every deploy workflow.

name: CI

on:
  pull_request:
    branches: [develop, release, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Turbo task cache: local only, remote explicitly off. The local `.turbo`
  # cache is never saved or restored between runs, so every run starts cold
  # and a stale cache entry cannot produce a false green.
  TURBO_CACHE: "local:rw"

jobs:
  node-checks:
    name: node-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its parents: HEAD^1 is the base branch
          # tip the merge was computed against (see the advisory gate below).
          fetch-depth: 2

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache on purpose: a pull_request run can only save
          # cache for its own ref, so new PRs never hit it, and each entry is
          # ~1.3 GB of the repo's 10 GB cache quota. Explicitly off: v5+
          # turns the cache on by itself when package.json's packageManager
          # (or devEngines.packageManager) names npm, and package.json is the
          # PR's. Today it names yarn, so nothing changes.
          package-manager-cache: false

      - name: Dependency advisories (OSV, gate code from the base branch)
        # Checks every version in yarn.lock and services/rust-api/Cargo.lock
        # against OSV (GitHub Advisory Database + RustSec), dependencies and
        # devDependencies alike. Ratchet: fails if this PR adds an advisory
        # the base branch does not have (any severity, per package and
        # workspace) that security/advisory-allowlist.json does not accept,
        # or if an allowlist entry is invalid or expired. Advisories already
        # in the base do not fail PRs; the weekly advisories.yml run fails on
        # them. Fails closed if OSV cannot be queried. Details and allowlist
        # format: scripts/advisory-gate.mjs, CONTRIBUTING.md.
        #
        # The gate code is the base branch's copy (HEAD^1), not the PR's, so a
        # PR cannot weaken the check that judges it; it reads the lockfiles
        # and the allowlist of the merge commit (HEAD) with `git show`.
        # Allowlist entries the PR adds or edits are listed as warnings for
        # the reviewer.
        #
        # It must stay the first step that runs anything from the checkout,
        # followed only by the lockfile entry age gate (same model). Every
        # later step of this job executes code the PR controls, and code that
        # ran earlier could reach these two through GITHUB_ENV or GITHUB_PATH:
        #   - Advisory gate self-test, lock age gate self-test: the PR's
        #     scripts and tests;
        #   - Toolchain versions and every yarn command after it: yarn 1
        #     runs the file named by `yarn-path` in the PR's .yarnrc;
        #   - Check package.json files against yarn.lock: the PR's script;
        #   - Install: yarn (as above), with --ignore-scripts;
        #   - Typecheck, seeds, Test, Guard, Lint, Build: the PR's code and
        #     configuration.
        # (setup-node only reads the version from .nvmrc.) A PR can still edit
        # this workflow itself: changes to .github/ need review.
        #
        # Bootstrap: while the base branch has no gate yet (PRs to
        # release/main until they receive it through a promotion), the gate
        # code of this PR must be develop's, byte for byte: every gate file
        # (the script and the scripts/lib/ modules) must have the same mode
        # and blob as in origin/develop, fetched in this step (shallow,
        # develop only; a failed fetch is exit 2). Then develop's copy runs,
        # with a warning. Any difference, a missing file included, is exit 2.
        # So until release/main receive the gate through a promotion, PRs to
        # them pass only when their gate files are byte-identical to
        # develop's: a hotfix branched from main does not have them and
        # fails. Promote develop first.
        #
        # Clean environment: the gate runs under `env -i` with only
        #   PATH                 to find git, which the gate runs (rev-parse,
        #                        ls-tree, show);
        #   HOME                 git's global config ($HOME/.gitconfig), as
        #                        for every other git command of this job;
        #   GITHUB_STEP_SUMMARY  where the gate writes its Markdown report.
        # Nothing else of the job's environment reaches it: no NODE_OPTIONS
        # (preloaded code), NODE_TLS_REJECT_UNAUTHORIZED, NODE_EXTRA_CA_CERTS,
        # SSL_CERT_*, HTTP(S)_PROXY or NODE_USE_ENV_PROXY (who answers for
        # OSV), GIT_* (another repository or git config). RUNNER_TEMP is not
        # passed: the gate writes no temporary files (this script uses it, the
        # gate does not).
        #
        # Positive proof: exit 0 is a pass only if the gate's output has
        # exactly one line "Result: PASS". An exit 0 without it (a CLI guard
        # that is false, e.g. the file run from stdin or under another name,
        # exits 0 having checked nothing) is exit 2. Any other exit code is
        # passed through. The gate's stdout goes to a file, not to a pipe,
        # and is printed with `cat` when the gate ends (stderr stays live):
        # Node writes to a pipe asynchronously, so process.exit() would drop
        # whatever a slow reader (the runner's log) had not taken yet, from
        # 64 KiB on, the "Result:" line included; writes to a file are
        # synchronous. A failing `cat` is exit 2.
        #
        # The gate imports the pure modules in scripts/lib/ (lockfile grammar,
        # output escaping); they are copied from the same commit as the gate.
        # A module the base does not have is not copied: an older,
        # self-contained gate does not need it, and a gate that imports it
        # fails to start (never falls back to the PR's copy).
        #
        # Setup problems (no merge commit, missing gate code) exit 2, like
        # the gate's own "could not run".
        #
        # Replaces `yarn audit`, which used npm's legacy audit endpoint and
        # saw only a small part of what OSV and the Dependabot alerts report
        # for the same yarn.lock.
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "::error title=advisory gate::HEAD is not a PR merge commit, so the base branch is unknown."
            exit 2
          fi
          git log -1 --format='base (HEAD^1): %H %s' HEAD^1
          git log -1 --format='head (HEAD):   %H %s' HEAD
          gate_dir="$RUNNER_TEMP/advisory-gate"
          mkdir -p "$gate_dir/lib"
          gate_files="scripts/advisory-gate.mjs scripts/lib/lockfile-grammar.mjs scripts/lib/gate-report.mjs"
          if [ -n "$(git ls-tree --name-only HEAD^1 -- scripts/advisory-gate.mjs)" ]; then
            gate_ref=HEAD^1
            echo "Gate code: scripts/advisory-gate.mjs (and scripts/lib/) from the base branch (HEAD^1)."
          else
            echo "Bootstrap: the base branch has no scripts/advisory-gate.mjs. This PR's gate code must be develop's."
            if ! git fetch --no-tags --depth=1 origin +refs/heads/develop:refs/remotes/origin/develop; then
              echo "::error title=advisory gate::Bootstrap: could not fetch develop to compare the gate code."
              exit 2
            fi
            for f in $gate_files; do
              develop_entry="$(git ls-tree refs/remotes/origin/develop -- "$f")"
              head_entry="$(git ls-tree HEAD -- "$f")"
              echo "develop: ${develop_entry:-$f missing}"
              echo "this PR: ${head_entry:-$f missing}"
              if [ -z "$develop_entry" ] || [ "$head_entry" != "$develop_entry" ]; then
                echo "::error title=advisory gate::Bootstrap: $f in this PR is not develop's (same mode and blob). Until the base branch receives the gate through a promotion, PRs to it pass only when their gate files are byte-identical to develop's; promote develop first."
                exit 2
              fi
            done
            gate_ref=refs/remotes/origin/develop
            echo "::warning title=advisory gate::The base branch has no scripts/advisory-gate.mjs yet, so this run uses develop's copy (identical to this PR's). Once the base has it, the base copy runs."
          fi
          git show --no-textconv "$gate_ref:scripts/advisory-gate.mjs" > "$gate_dir/advisory-gate.mjs"
          for f in scripts/lib/lockfile-grammar.mjs scripts/lib/gate-report.mjs; do
            if [ -n "$(git ls-tree --name-only "$gate_ref" -- "$f")" ]; then
              git show --no-textconv "$gate_ref:$f" > "$gate_dir/lib/${f##*/}"
            else
              echo "$f is not in $gate_ref: not copied."
            fi
          done
          find "$gate_dir" -type f -name '*.mjs' -exec sha256sum {} +
          node_bin="$(command -v node)"
          echo "$node_bin $("$node_bin" --version)"
          set +e
          env -i PATH="$PATH" HOME="$HOME" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" \
            "$node_bin" "$gate_dir/advisory-gate.mjs" --mode ratchet --base HEAD^1 --head HEAD > "$gate_dir/output.log"
          code=$?
          set -e
          if ! cat "$gate_dir/output.log"; then
            echo "::error title=advisory gate::Could not print the gate's output, so the result is unknown."
            exit 2
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          passes="$(awk '$0 == "Result: PASS" { n++ } END { print n + 0 }' "$gate_dir/output.log")"
          if [ "$passes" -ne 1 ]; then
            echo "::error title=advisory gate::The gate exited 0 but printed $passes \"Result: PASS\" lines (exactly 1 expected), so it did not prove it checked anything. Not a pass."
            exit 2
          fi

      - name: Lockfile entry age (minimum 7 days, gate code from the base branch)
        if: ${{ !cancelled() }}
        # Fails if a name@version that this PR adds to yarn.lock or
        # services/rust-api/Cargo.lock (direct or transitive, on every PR, not
        # only Dependabot's) was published less than 7 days ago, per the npm
        # registry (`time`) or crates.io (`created_at`), unless
        # security/lock-age-allowlist.json accepts it, or if an exception is
        # invalid or expired. Fails closed if a registry lookup fails or a
        # lockfile entry is not a registry package (closed grammar of the
        # advisory gate). A change of only `resolved`/`integrity`/`checksum`
        # for the same name@version is not in its scope. Details and the
        # exception format: scripts/lock-entry-ages.mjs, CONTRIBUTING.md.
        #
        # Same model as the advisory gate above: scripts/lock-entry-ages.mjs
        # and the pure modules it imports (scripts/lib/lockfile-grammar.mjs,
        # scripts/lib/gate-report.mjs) all come from the base branch (HEAD^1),
        # copied to $RUNNER_TEMP with `git show`; the lockfiles and the
        # exceptions of the merge commit (HEAD) are read with `git show`. It
        # does not import advisory-gate.mjs, and neither gate runs its CLI on
        # import whatever Node version .nvmrc selects (see the scripts). It
        # runs before any step that executes PR code (see the list above).
        #
        # Bootstrap, narrow on purpose. The marker is the base branch having
        # security/lock-age-allowlist.json (created with this gate; deleting
        # it needs a code owner's review, and the gate fails a PR that
        # deletes it, exit 1):
        #   - base has it: only the base's copies run; if the base lacks one
        #     of the three files, the step fails (exit 2) instead of falling
        #     back to the PR's copy;
        #   - base does not have it (PRs to release/main until they receive
        #     the gate through a promotion): the three files of this PR must
        #     be develop's, same mode and blob as in origin/develop, fetched
        #     in this step (shallow, develop only; a failed fetch is exit 2);
        #     then develop's copies run, with a warning. Any difference, a
        #     missing file included, is exit 2: until then, PRs to
        #     release/main pass only when their gate files are byte-identical
        #     to develop's (a hotfix branched from main fails). Promote
        #     develop first. Those branches also have no Cargo.lock: a
        #     lockfile missing in the base counts as empty, so every crate of
        #     the head is checked.
        # ("The base has the script" cannot be the test: lock-entry-ages.mjs
        # existed before as a manual tool. A grep of the base's ci.yml was
        # not used either: a rewrite of the workflow would silently reopen
        # the bootstrap.)
        #
        # Clean environment and positive proof: as in the advisory gate above
        # (`env -i` with PATH, HOME and GITHUB_STEP_SUMMARY only; exit 0 is a
        # pass only with exactly one "Result: PASS" line, else exit 2).
        #
        # Setup problems (no merge commit, missing gate code, bootstrap gate
        # code that is not develop's) exit 2, like the gate's own "could not
        # run".
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "::error title=lock age gate::HEAD is not a PR merge commit, so the base branch is unknown."
            exit 2
          fi
          git log -1 --format='base (HEAD^1): %H %s' HEAD^1
          git log -1 --format='head (HEAD):   %H %s' HEAD
          gate_dir="$RUNNER_TEMP/lock-age-gate"
          mkdir -p "$gate_dir/lib"
          gate_files="scripts/lock-entry-ages.mjs scripts/lib/lockfile-grammar.mjs scripts/lib/gate-report.mjs"
          if [ -n "$(git ls-tree --name-only HEAD^1 -- security/lock-age-allowlist.json)" ]; then
            gate_ref=HEAD^1
            echo "Gate code: $gate_files from the base branch (HEAD^1), which has security/lock-age-allowlist.json."
          else
            echo "Bootstrap: the base branch has no security/lock-age-allowlist.json. This PR's gate code must be develop's."
            if ! git fetch --no-tags --depth=1 origin +refs/heads/develop:refs/remotes/origin/develop; then
              echo "::error title=lock age gate::Bootstrap: could not fetch develop to compare the gate code."
              exit 2
            fi
            for f in $gate_files; do
              develop_entry="$(git ls-tree refs/remotes/origin/develop -- "$f")"
              head_entry="$(git ls-tree HEAD -- "$f")"
              echo "develop: ${develop_entry:-$f missing}"
              echo "this PR: ${head_entry:-$f missing}"
              if [ -z "$develop_entry" ] || [ "$head_entry" != "$develop_entry" ]; then
                echo "::error title=lock age gate::Bootstrap: $f in this PR is not develop's (same mode and blob). Until the base branch receives the lock age gate through a promotion, PRs to it pass only when their gate files are byte-identical to develop's; promote develop first."
                exit 2
              fi
            done
            gate_ref=refs/remotes/origin/develop
            echo "::warning title=lock age gate::Bootstrap: the base branch has no security/lock-age-allowlist.json (no lock age gate yet), so this run uses develop's copy of $gate_files (identical to this PR's). Once the base has that file, only the base copy runs."
          fi
          for f in $gate_files; do
            if [ -z "$(git ls-tree --name-only "$gate_ref" -- "$f")" ]; then
              echo "::error title=lock age gate::$f is not in $gate_ref. The gate code is not taken from anywhere else; restore the file."
              exit 2
            fi
          done
          git show --no-textconv "$gate_ref:scripts/lock-entry-ages.mjs" > "$gate_dir/lock-entry-ages.mjs"
          git show --no-textconv "$gate_ref:scripts/lib/lockfile-grammar.mjs" > "$gate_dir/lib/lockfile-grammar.mjs"
          git show --no-textconv "$gate_ref:scripts/lib/gate-report.mjs" > "$gate_dir/lib/gate-report.mjs"
          sha256sum "$gate_dir/lock-entry-ages.mjs" "$gate_dir/lib/lockfile-grammar.mjs" "$gate_dir/lib/gate-report.mjs"
          node_bin="$(command -v node)"
          echo "$node_bin $("$node_bin" --version)"
          set +e
          env -i PATH="$PATH" HOME="$HOME" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" \
            "$node_bin" "$gate_dir/lock-entry-ages.mjs" --base HEAD^1 --head HEAD > "$gate_dir/output.log"
          code=$?
          set -e
          if ! cat "$gate_dir/output.log"; then
            echo "::error title=lock age gate::Could not print the gate's output, so the result is unknown."
            exit 2
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          passes="$(awk '$0 == "Result: PASS" { n++ } END { print n + 0 }' "$gate_dir/output.log")"
          if [ "$passes" -ne 1 ]; then
            echo "::error title=lock age gate::The gate exited 0 but printed $passes \"Result: PASS\" lines (exactly 1 expected), so it did not prove it checked anything. Not a pass."
            exit 2
          fi

      - name: Advisory gate self-test
        if: ${{ !cancelled() }}
        # Unit tests of this PR's copy of the gate (no network: git and OSV
        # are faked), so a change to the gate is tested before it becomes
        # the base copy. Fails if fewer than ADVISORY_GATE_MIN_TESTS pass or
        # any test is skipped or todo (an emptied test file would pass
        # `node --test`). Raise the number when you add tests.
        env:
          ADVISORY_GATE_MIN_TESTS: "70"
        run: |
          node --test --test-reporter=tap scripts/advisory-gate.test.mjs | tee "$RUNNER_TEMP/advisory-gate-tests.tap"
          TAP="$RUNNER_TEMP/advisory-gate-tests.tap"
          for k in pass fail skipped todo; do
            if [ "$(grep -c "^# $k [0-9][0-9]*\$" "$TAP")" -ne 1 ]; then
              echo "::error title=advisory gate self-test::The TAP summary line '# $k N' must appear exactly once (a test that prints it could fake the count)."
              exit 2
            fi
          done
          count() { sed -n "s/^# $1 \([0-9][0-9]*\)$/\1/p" "$TAP"; }
          pass="$(count pass)"; skipped="$(count skipped)"; todo="$(count todo)"
          echo "advisory gate tests: pass=${pass:-none} skipped=${skipped:-none} todo=${todo:-none} (minimum $ADVISORY_GATE_MIN_TESTS)"
          if [ -z "$pass" ] || [ "$pass" -lt "$ADVISORY_GATE_MIN_TESTS" ] || [ "${skipped:-1}" -ne 0 ] || [ "${todo:-1}" -ne 0 ]; then
            echo "::error title=advisory gate self-test::Expected at least $ADVISORY_GATE_MIN_TESTS passing tests and none skipped or todo; got pass=${pass:-none} skipped=${skipped:-none} todo=${todo:-none}."
            exit 1
          fi

      - name: Lock age gate self-test
        if: ${{ !cancelled() }}
        # Unit tests of this PR's copy of scripts/lock-entry-ages.mjs (no
        # network: git, the registries and the clock are faked), same rules
        # as the advisory gate self-test. Raise the number when you add tests.
        env:
          LOCK_AGE_GATE_MIN_TESTS: "83"
        run: |
          node --test --test-reporter=tap scripts/lock-entry-ages.test.mjs scripts/lock-entry-ages.edges.test.mjs | tee "$RUNNER_TEMP/lock-age-gate-tests.tap"
          TAP="$RUNNER_TEMP/lock-age-gate-tests.tap"
          for k in pass fail skipped todo; do
            if [ "$(grep -c "^# $k [0-9][0-9]*\$" "$TAP")" -ne 1 ]; then
              echo "::error title=lock age gate self-test::The TAP summary line '# $k N' must appear exactly once (a test that prints it could fake the count)."
              exit 2
            fi
          done
          count() { sed -n "s/^# $1 \([0-9][0-9]*\)$/\1/p" "$TAP"; }
          pass="$(count pass)"; skipped="$(count skipped)"; todo="$(count todo)"
          echo "lock age gate tests: pass=${pass:-none} skipped=${skipped:-none} todo=${todo:-none} (minimum $LOCK_AGE_GATE_MIN_TESTS)"
          if [ -z "$pass" ] || [ "$pass" -lt "$LOCK_AGE_GATE_MIN_TESTS" ] || [ "${skipped:-1}" -ne 0 ] || [ "${todo:-1}" -ne 0 ]; then
            echo "::error title=lock age gate self-test::Expected at least $LOCK_AGE_GATE_MIN_TESTS passing tests and none skipped or todo; got pass=${pass:-none} skipped=${skipped:-none} todo=${todo:-none}."
            exit 1
          fi

      - name: Reference extractor tests
        if: ${{ !cancelled() }}
        # Unit tests of scripts/extract-references.mjs (no network: the
        # sources are synthetic git repositories made in a temp dir). Same
        # rules as the gate self-tests: fails if any test fails, fewer than
        # REFERENCE_EXTRACTOR_MIN_TESTS pass, or any is skipped or todo.
        # Raise the number when you add tests.
        env:
          REFERENCE_EXTRACTOR_MIN_TESTS: "192"
        run: |
          node --test --test-reporter=tap scripts/extract-references.test.mjs | tee "$RUNNER_TEMP/reference-extractor-tests.tap"
          TAP="$RUNNER_TEMP/reference-extractor-tests.tap"
          for k in pass fail skipped todo; do
            if [ "$(grep -c "^# $k [0-9][0-9]*\$" "$TAP")" -ne 1 ]; then
              echo "::error title=reference extractor tests::The TAP summary line '# $k N' must appear exactly once (a test that prints it could fake the count)."
              exit 2
            fi
          done
          count() { sed -n "s/^# $1 \([0-9][0-9]*\)$/\1/p" "$TAP"; }
          pass="$(count pass)"; fail="$(count fail)"; skipped="$(count skipped)"; todo="$(count todo)"
          echo "reference extractor tests: pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none} (minimum $REFERENCE_EXTRACTOR_MIN_TESTS)"
          if [ -z "$pass" ] || [ "$pass" -lt "$REFERENCE_EXTRACTOR_MIN_TESTS" ] || [ "${fail:-1}" -ne 0 ] || [ "${skipped:-1}" -ne 0 ] || [ "${todo:-1}" -ne 0 ]; then
            echo "::error title=reference extractor tests::Expected at least $REFERENCE_EXTRACTOR_MIN_TESTS passing tests and none failed, skipped or todo; got pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none}."
            exit 1
          fi

      - name: Seed copy guard
        if: ${{ !cancelled() }}
        # Fails if a copy of an Ohara trail seed or of its schema is versioned
        # outside packages/ohara-data (by name, by trail shape or by the
        # schema's $id). Reads only the git index of the checkout, so
        # untracked files cannot hide or fake anything, and runs outside turbo,
        # so no task cache can skip it. Fixtures go in its ALLOWLIST.
        run: node scripts/check-seed-copies.mjs

      - name: Seed copy guard tests
        if: ${{ !cancelled() }}
        # Unit tests of scripts/check-seed-copies.mjs (throwaway git
        # repositories in a temp dir). Fails if any test fails, fewer than
        # SEED_COPY_GUARD_MIN_TESTS pass, or any is skipped or todo. Raise the
        # number when you add tests.
        env:
          SEED_COPY_GUARD_MIN_TESTS: "27"
        run: |
          node --test --test-reporter=tap scripts/check-seed-copies.test.mjs | tee "$RUNNER_TEMP/seed-copy-guard-tests.tap"
          TAP="$RUNNER_TEMP/seed-copy-guard-tests.tap"
          for k in pass fail skipped todo; do
            if [ "$(grep -c "^# $k [0-9][0-9]*\$" "$TAP")" -ne 1 ]; then
              echo "::error title=seed copy guard tests::The TAP summary line '# $k N' must appear exactly once (a test that prints it could fake the count)."
              exit 2
            fi
          done
          count() { sed -n "s/^# $1 \([0-9][0-9]*\)$/\1/p" "$TAP"; }
          pass="$(count pass)"; fail="$(count fail)"; skipped="$(count skipped)"; todo="$(count todo)"
          echo "seed copy guard tests: pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none} (minimum $SEED_COPY_GUARD_MIN_TESTS)"
          if [ -z "$pass" ] || [ "$pass" -lt "$SEED_COPY_GUARD_MIN_TESTS" ] || [ "${fail:-1}" -ne 0 ] || [ "${skipped:-1}" -ne 0 ] || [ "${todo:-1}" -ne 0 ]; then
            echo "::error title=seed copy guard tests::Expected at least $SEED_COPY_GUARD_MIN_TESTS passing tests and none failed, skipped or todo; got pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none}."
            exit 1
          fi

      - name: Link verifier tests
        if: ${{ !cancelled() }}
        # Unit tests of scripts/verify-sources.mjs, with no network: fetch and
        # DNS are injected. They cover the https-only and SSRF screen (loopback,
        # private, link-local and metadata addresses, IPv4-compatible,
        # -translated and Teredo IPv6, non-default ports, also behind a
        # redirect), the redirect limit, timeouts, headers and the report. The network run
        # itself is in links.yml. Same count rules as above.
        env:
          LINK_VERIFIER_MIN_TESTS: "124"
        run: |
          node --test --test-reporter=tap scripts/verify-sources.test.mjs | tee "$RUNNER_TEMP/link-verifier-tests.tap"
          TAP="$RUNNER_TEMP/link-verifier-tests.tap"
          for k in pass fail skipped todo; do
            if [ "$(grep -c "^# $k [0-9][0-9]*\$" "$TAP")" -ne 1 ]; then
              echo "::error title=link verifier tests::The TAP summary line '# $k N' must appear exactly once (a test that prints it could fake the count)."
              exit 2
            fi
          done
          count() { sed -n "s/^# $1 \([0-9][0-9]*\)$/\1/p" "$TAP"; }
          pass="$(count pass)"; fail="$(count fail)"; skipped="$(count skipped)"; todo="$(count todo)"
          echo "link verifier tests: pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none} (minimum $LINK_VERIFIER_MIN_TESTS)"
          if [ -z "$pass" ] || [ "$pass" -lt "$LINK_VERIFIER_MIN_TESTS" ] || [ "${fail:-1}" -ne 0 ] || [ "${skipped:-1}" -ne 0 ] || [ "${todo:-1}" -ne 0 ]; then
            echo "::error title=link verifier tests::Expected at least $LINK_VERIFIER_MIN_TESTS passing tests and none failed, skipped or todo; got pass=${pass:-none} fail=${fail:-none} skipped=${skipped:-none} todo=${todo:-none}."
            exit 1
          fi

      # The steps below run even if the advisory gate failed, so one run
      # shows every failure.

      - name: Toolchain versions
        id: toolchain
        if: ${{ !cancelled() }}
        run: |
          node --version
          yarn --version
          # The repo is yarn 1 only (packageManager: yarn@1.22.22).
          case "$(yarn --version)" in
            1.*) ;;
            *) echo "::error::yarn 1.x required (packageManager: yarn@1.22.22), got $(yarn --version)"; exit 1 ;;
          esac

      - name: Check package.json files against yarn.lock
        if: ${{ !cancelled() }}
        # Same check the production build of bff-api runs before installing,
        # so a false positive shows up here and not at deploy time.
        run: node scripts/check-lockfile-sync.mjs

      - name: Install dependencies (no lifecycle scripts, lockfile must not change)
        id: install
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        # --ignore-scripts skips install/postinstall of dependencies (esbuild,
        # sharp, workerd, @parcel/watcher, nice-napi). Typecheck, tests, lint
        # and the vite build were verified to work without them: esbuild and
        # friends ship their native binaries as optional dependencies.
        #
        # No --frozen-lockfile here, on purpose: yarn 1 with that flag never
        # writes yarn.lock, so the diff below could not fail, and a stale
        # (dead) entry in yarn.lock would pass. Without it, yarn rewrites the
        # lockfile whenever it is not exactly what package.json resolves to
        # (missing range, drifted workspace, dead entry), and the diff fails
        # the job. The production deploys install with --frozen-lockfile:
        # they must never resolve anything that is not in yarn.lock.
        run: |
          yarn install --ignore-scripts --non-interactive
          git diff --exit-code -- yarn.lock

      # rust-api is excluded from every turbo run below: its tasks are cargo
      # commands, checked by the rust-checks job.
      #
      # The checks below run even if an earlier one failed, so a single run
      # shows every failure. They are skipped only if install failed.

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn turbo run typecheck --filter='!rust-api'

      - name: Validate Ohara seeds against schema
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Runs the ajv schema test on its own so a seed/schema mismatch shows
        # up as a named step. It is also part of the full test run below.
        run: yarn workspace @jpfig/ohara-front vitest run src/schema.test.ts

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn turbo run test --filter='!rust-api'

      - name: Guard against an empty or skipped test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # `turbo run test` exits 0 when no package has a test script, and
        # vitest and `node --test` exit 0 when tests are skipped. This fails if
        # an expected test task disappears, or if the ohara-front or edge-proxy
        # suite drops below its minimum test count or has skipped/todo tests.
        # Expected numbers and how to update them: scripts/check-test-suite.mjs.
        # Keep the --filter equal to the Test step's.
        run: |
          yarn -s turbo run test --filter='!rust-api' --dry=json > "$RUNNER_TEMP/turbo-test-dry.json"
          yarn -s workspace @jpfig/ohara-front vitest run \
            --reporter=json --outputFile="$RUNNER_TEMP/ohara-front-vitest.json" > /dev/null
          node --test --test-timeout=60000 --test-reporter=tap services/edge-proxy/test/*.test.mjs > "$RUNNER_TEMP/edge-proxy-tests.tap"
          node scripts/check-test-suite.mjs "$RUNNER_TEMP/turbo-test-dry.json" \
            "$RUNNER_TEMP/ohara-front-vitest.json" "$RUNNER_TEMP/edge-proxy-tests.tap"

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn turbo run lint --filter='!rust-api'

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The same `turbo run build` the Pages deploy runs, minus rust-api
        # (rust-checks compiles it). Catches what only the bundler sees, e.g. an
        # import of a file that does not exist. Output stays on the runner: no
        # artifact upload, no deploy.
        id: build
        run: yarn turbo run build --filter='!rust-api'

      - name: Guard against a skipped edge-proxy build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # `turbo run build` exits 0 when a package has no `build` script, so
        # the Worker bundle could silently stop being checked here and a
        # bundling error would first show up in the production deploy. The
        # build writes services/edge-proxy/dist/index.js; it must exist. The
        # checkout is fresh and the turbo cache starts empty on every run (see
        # TURBO_CACHE above), so the file can only come from this run's build.
        run: |
          bundle=services/edge-proxy/dist/index.js
          if [ ! -s "$bundle" ]; then
            echo "::error title=edge-proxy build guard::$bundle was not built: the edge-proxy \"build\" script is missing or did not run in turbo run build."
            exit 1
          fi
          ls -l "$bundle"
          sha256sum "$bundle"

      - name: Guard against the react-router development build in web
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # react-router 7 exports only its development build
        # (remix-run/react-router#14102, fixed in v8), so web/vite.config.ts
        # aliases it to the package's dist/production for `vite build`. If the
        # alias stops applying, the build still passes but the published site
        # shows the "Hey developer" note and logs dev warnings. Both strings
        # below are dev-only: present once in a bundle built without the alias,
        # absent from the production build. Two of them, so one rewording
        # upstream does not blind the guard. grep exit 1 (no match) passes;
        # 0 (match) fails; anything else (unreadable file) is exit 2.
        run: |
          shopt -s nullglob
          bundles=(web/dist/assets/*.js)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error title=react-router build guard::no web/dist/assets/*.js: web was not built."
            exit 1
          fi
          rc=0
          grep -l -F -e 'Hey developer' -e 'No routes matched location' "${bundles[@]}" || rc=$?
          case "$rc" in
            0) echo "::error title=react-router build guard::the files above contain the react-router development build. Check the react-router alias in web/vite.config.ts."
               exit 1 ;;
            1) echo "OK: no react-router development build in ${#bundles[@]} web bundle(s)." ;;
            *) echo "::error title=react-router build guard::grep failed (exit $rc)."
               exit 2 ;;
          esac

  rust-checks:
    name: rust-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Pinned toolchain, so a new stable release (new clippy lints, new
      # rustfmt rules) cannot turn PRs red on its own. To upgrade, change this
      # value in a PR. Installed with the runner's preinstalled rustup, from
      # static.rust-lang.org; no third-party action.
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Minimum number of Rust tests that must pass (route tests in
      # services/rust-api/src/main.rs). Raise it when you add tests; see
      # scripts/check-cargo-tests.sh.
      RUST_MIN_TESTS: "27"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its parents: HEAD^1 is the base branch tip,
          # so `git diff HEAD^1 HEAD` is exactly what this PR changes.
          fetch-depth: 2

      - name: Detect Rust changes
        id: changes
        # Plain git, no path-filter action. Fails closed: if HEAD is not a
        # two-parent merge commit, the Rust checks run anyway; if git diff
        # errors, the job fails.
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "::notice title=rust-checks::HEAD is not a PR merge commit, running the Rust checks."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Root-level cargo/rustfmt/clippy config also changes what cargo
          # does in services/rust-api, so it triggers the checks too, and so
          # does the test-suite guard script.
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            services/rust-api .github/workflows/ci.yml \
            scripts/check-cargo-tests.sh \
            Cargo.toml Cargo.lock rustfmt.toml .rustfmt.toml \
            clippy.toml .clippy.toml .cargo)"
          if [ -n "$changed" ]; then
            echo "Files that trigger the Rust checks:"
            echo "$changed"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under services/rust-api, root cargo config or this workflow: skipping the Rust checks."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust version agrees (Dockerfile image, Dockerfile check, RUSTUP_TOOLCHAIN)
        # Runs on every PR (no compile, a few greps). A PR that changes the
        # rust image tag (e.g. from Dependabot) must also change the
        # Dockerfile's expected rustc and RUSTUP_TOOLCHAIN above; this fails
        # with an annotation that says so instead of failing inside
        # `docker build`.
        run: bash scripts/check-rust-toolchain.sh services/rust-api/Dockerfile "$RUSTUP_TOOLCHAIN"

      - name: Install Rust toolchain
        id: toolchain
        if: ${{ steps.changes.outputs.rust == 'true' }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt --no-self-update
          rustc --version
          cargo --version
          rustc --version | grep -q "^rustc $RUSTUP_TOOLCHAIN "

      - name: Swagger UI zip (pinned version and SHA-256)
        id: swagger-ui
        if: ${{ steps.changes.outputs.rust == 'true' }}
        # utoipa-swagger-ui's build script embeds the Swagger UI release zip.
        # Without SWAGGER_UI_DOWNLOAD_URL it downloads it from GitHub with no
        # checksum (services/rust-api/.cargo/config.toml makes that case fail
        # instead). This step downloads it with the script the Dockerfile
        # uses, which fails unless the SHA-256 matches the one it pins; clippy
        # and test below point SWAGGER_UI_DOWNLOAD_URL at the checked file.
        run: bash services/rust-api/scripts/fetch-swagger-ui.sh "$RUNNER_TEMP/swagger-ui"

      # No cargo cache on purpose (same reason as node-checks; a cache of
      # target/ or ~/.cargo written by PR code is a poisoning vector), so each
      # run compiles from scratch.
      #
      # Every cargo command that resolves dependencies runs with --locked:
      # they come only from services/rust-api/Cargo.lock, and a Cargo.toml
      # change that needs a different lock fails the job instead of resolving
      # silently. (cargo fmt reads no dependencies and has no --locked flag.)
      #
      # fmt, clippy, test and the docker build run even if an earlier one
      # failed.

      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        working-directory: services/rust-api
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.swagger-ui.outcome == 'success' }}
        working-directory: services/rust-api
        env:
          SWAGGER_UI_DOWNLOAD_URL: file://${{ runner.temp }}/swagger-ui/swagger-ui.zip
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        id: cargo-test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.swagger-ui.outcome == 'success' }}
        working-directory: services/rust-api
        env:
          SWAGGER_UI_DOWNLOAD_URL: file://${{ runner.temp }}/swagger-ui/swagger-ui.zip
        run: cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.txt"

      - name: Guard against an empty or skipped Rust test suite
        if: ${{ !cancelled() && steps.cargo-test.outcome == 'success' }}
        # cargo test exits 0 with zero tests, or with tests ignored or
        # filtered out. This fails unless at least RUST_MIN_TESTS passed and
        # none was ignored or filtered out.
        run: bash scripts/check-cargo-tests.sh "$RUNNER_TEMP/cargo-test.txt" "$RUST_MIN_TESTS"

      - name: docker build (services/rust-api)
        id: docker-build
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' }}
        # Builds the same Dockerfile Render builds, so a broken image fails
        # here and not at deploy time. Local image only: no push, no registry
        # login, no secrets, no build cache imported or exported. Base images
        # are pinned by digest in the Dockerfile.
        working-directory: services/rust-api
        run: |
          docker version --format 'docker client {{.Client.Version}}, server {{.Server.Version}}'
          docker build --progress=plain --tag rust-api:ci .
          docker image inspect rust-api:ci --format 'image {{.Id}}, user {{.Config.User}}, healthcheck {{json .Config.Healthcheck.Test}}'

      - name: Smoke test the image (HEALTHCHECK, /health, OpenAPI, Swagger UI)
        id: smoke
        if: ${{ !cancelled() && steps.docker-build.outcome == 'success' }}
        # Runs the image as built (no extra flags), waits for its own
        # HEALTHCHECK to report healthy, checks that the process runs as uid
        # 10001 (the USER in the Dockerfile), that /health answers
        # "status":"ok" from the host, that /api-docs/openapi.json is an
        # OpenAPI document and that /swagger-ui/ serves the embedded UI.
        # Port bound to 127.0.0.1 only.
        run: |
          docker run --detach --name rust-api-ci --publish 127.0.0.1:8080:8080 rust-api:ci
          health=starting
          # Waits up to 90s for the first HEALTHCHECK result (the interval is
          # 30s; recent engines also probe during the 10s start period).
          for _ in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' rust-api-ci)"
            [ "$health" = starting ] || break
            sleep 2
          done
          docker logs rust-api-ci
          if [ "$health" != healthy ]; then
            echo "::error title=docker smoke test::Container health is '$health', expected 'healthy'."
            docker inspect --format '{{json .State.Health}}' rust-api-ci
            exit 1
          fi
          echo "Container health: $health"
          uid="$(docker exec rust-api-ci id -u)"
          echo "Container uid: $uid"
          if [ "$uid" != "10001" ]; then
            echo "::error title=docker smoke test::Container runs as uid '$uid', expected 10001."
            exit 1
          fi
          body="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/health)"
          echo "GET /health: $body"
          if ! grep -q '"status":"ok"' <<<"$body"; then
            echo "::error title=docker smoke test::/health did not return \"status\":\"ok\"."
            exit 1
          fi
          spec="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api-docs/openapi.json)"
          echo "GET /api-docs/openapi.json: $(wc -c <<<"$spec") bytes, $(grep -o '"openapi":"[^"]*"' <<<"$spec")"
          if ! grep -q '"openapi":"3\.' <<<"$spec"; then
            echo "::error title=docker smoke test::/api-docs/openapi.json is not an OpenAPI 3 document."
            exit 1
          fi
          ui="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/swagger-ui/)"
          echo "GET /swagger-ui/: $(wc -c <<<"$ui") bytes"
          if ! grep -q 'swagger-ui-bundle.js' <<<"$ui"; then
            echo "::error title=docker smoke test::/swagger-ui/ does not serve the Swagger UI page."
            exit 1
          fi

      - name: Smoke test the image's security headers and CORS
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        # Same container as the step above, with the job's shell (bash -e -o
        # pipefail). Checks the headers the image serves
        # (services/rust-api/src/main.rs sets them):
        #   - /health and /swagger-ui/: X-Content-Type-Options,
        #     X-Frame-Options and Referrer-Policy, exact values;
        #   - /health: the API's Content-Security-Policy, exact value;
        #   - /swagger-ui/: invariants of the UI's CSP, not its value (its
        #     hash belongs to the Swagger UI version; cargo test pins it):
        #     one header, frame-ancestors 'none', a 'sha256-' source, no
        #     'unsafe-' keyword, and not the API's CSP;
        #   - CORS: GET /health with Origin https://jpfigueredo.github.io gets
        #     that origin back in Access-Control-Allow-Origin, and with
        #     Origin https://evil.example gets none.
        # A failed request does not stop the step: each check reports its
        # header and the reason with ::error, every check runs, then the step
        # exits 1 if any failed.
        run: |
          api_csp="default-src 'none'; frame-ancestors 'none'"
          pages_origin="https://jpfigueredo.github.io"
          failed=0
          fail() {
            echo "::error title=docker smoke test::$1"
            failed=1
          }
          # fetch <path> <header> [curl args...]: sets `values` to every line
          # of the response header (empty when absent), `count` to their
          # number, and `why` to the reason when the request failed (empty
          # when it worked). Never fails itself.
          fetch() {
            local path="$1" name="$2" response code=0
            shift 2
            label="GET $path${*:+ ($*)}"
            response="$(curl --fail --silent --show-error --max-time 10 --dump-header - --output /dev/null "$@" \
              "http://127.0.0.1:8080$path" 2>&1)" || code=$?
            response="$(tr -d '\r' <<<"$response")"
            why=""
            if [ "$code" -ne 0 ]; then
              why="curl exit $code: $(tail -n 1 <<<"$response")"
            fi
            values="$(awk -v name="$name" 'index(tolower($0), tolower(name) ":") == 1 { sub(/^[^:]*:[ \t]*/, ""); print }' <<<"$response")"
            count="$(awk -v name="$name" 'index(tolower($0), tolower(name) ":") == 1 { n++ } END { print n + 0 }' <<<"$response")"
            echo "$label $name: ${values:-<absent>}"
          }
          # expect <path> <header> <value> [curl args...]: exactly one line,
          # equal to <value>.
          expect() {
            local path="$1" name="$2" expected="$3"
            shift 3
            fetch "$path" "$name" "$@"
            if [ -n "$why" ]; then
              fail "$label: $name not checked, the request failed ($why)."
            elif [ "$count" -ne 1 ] || [ "$values" != "$expected" ]; then
              fail "$label: $name is '$values' ($count line(s)), expected '$expected'."
            fi
          }
          # expect_absent <path> <header> [curl args...]
          expect_absent() {
            local path="$1" name="$2"
            shift 2
            fetch "$path" "$name" "$@"
            if [ -n "$why" ]; then
              fail "$label: $name not checked, the request failed ($why)."
            elif [ "$count" -ne 0 ]; then
              fail "$label: $name is '$values', expected no such header."
            fi
          }
          for path in /health /swagger-ui/; do
            expect "$path" x-content-type-options nosniff
            expect "$path" x-frame-options DENY
            expect "$path" referrer-policy no-referrer
          done
          expect /health content-security-policy "$api_csp"

          fetch /swagger-ui/ content-security-policy
          if [ -n "$why" ]; then
            fail "$label: content-security-policy not checked, the request failed ($why)."
          elif [ "$count" -ne 1 ]; then
            fail "$label: $count content-security-policy lines, expected 1."
          else
            case "$values" in
              *"frame-ancestors 'none'"*) ;;
              *) fail "$label: content-security-policy has no frame-ancestors 'none'." ;;
            esac
            case "$values" in
              *"'sha256-"*) ;;
              *) fail "$label: content-security-policy has no 'sha256-' source." ;;
            esac
            case "$values" in
              *unsafe-*) fail "$label: content-security-policy has an 'unsafe-' keyword." ;;
            esac
            if [ "$values" = "$api_csp" ]; then
              fail "$label: content-security-policy is the API's, not the UI's."
            fi
          fi

          expect /health access-control-allow-origin "$pages_origin" -H "Origin: $pages_origin"
          expect_absent /health access-control-allow-origin -H "Origin: https://evil.example"
          exit "$failed"

      - name: Remove the smoke test container
        if: ${{ always() }}
        # Idempotent cleanup: the container does not exist when the build or
        # the smoke test did not get far enough to start it, so a failing
        # `docker rm` is expected there and must not fail the job.
        run: docker rm -f rust-api-ci || true
