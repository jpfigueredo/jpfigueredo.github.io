# Dependabot version updates.
#
# Everything here is pinned (yarn.lock, Cargo.lock, base images by digest,
# actions by commit SHA). Pins keep builds reproducible, but they also freeze
# known bugs and vulnerabilities; this file is the process that moves them.
#
# Rules for every ecosystem below:
#   - pull requests target `develop` (the default branch), like any feature PR,
#     and run the same CI (node-checks, rust-checks): read-only token, no
#     secrets, the same threat model as a pull request from a fork;
#   - weekly, on Monday 09:00 UTC;
#   - cooldown: a release is only proposed 7 days after it was published.
#     Security updates are not delayed (cooldown applies to version updates
#     only);
#   - minor and patch updates are grouped into one PR per group; major
#     updates come one dependency per PR, so a breaking change is reviewed
#     on its own;
#   - `labels: []`: no labels. Without it, Dependabot creates and applies
#     `dependencies` plus one label per ecosystem;
#   - nothing is merged automatically. Review steps: CONTRIBUTING.md,
#     "Dependency updates (Dependabot)".
#
# Options reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  # ------------------------------------------------------------ npm (yarn 1)
  # Root package.json + yarn.lock. Dependabot follows the `workspaces` field,
  # so every workspace package.json is covered by this one entry.
  # archive/ is not a workspace and has no lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      - "archive/**"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    # `increase`: the range in package.json moves with the version in
    # yarn.lock (e.g. ^2.11.10 -> ^2.12.0), so the manifest states the
    # version that was actually tested. Same style as manual bumps here.
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: []
    groups:
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      npm-production:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ------------------------------------------------------- cargo (rust-api)
  - package-ecosystem: "cargo"
    directory: "/services/rust-api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    # `increase-if-necessary`: Cargo.toml keeps its ranges (e.g. "0.7") while
    # the new version fits them, and only Cargo.lock changes. A version
    # outside the range (a major, or a 0.x minor) rewrites the requirement.
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels: []
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------- docker (rust-api images)
  # services/rust-api/Dockerfile pins `image:tag@sha256:digest`. Dependabot
  # updates the digest when the tag is rebuilt (e.g. a Debian security
  # rebuild of debian:trixie-slim) and the tag plus digest when a newer
  # version tag exists. Both images are grouped so builder and runtime move
  # together and stay on the same Debian release.
  - package-ecosystem: "docker"
    directory: "/services/rust-api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    labels: []
    # New Rust versions are not proposed here: the toolchain version is also
    # pinned in the Dockerfile's `rustc --version` check and in
    # RUSTUP_TOOLCHAIN (.github/workflows/ci.yml), which Dependabot does not
    # edit. A Rust upgrade is one manual PR that changes all three. Digest
    # refreshes of the current rust tag still come through.
    ignore:
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        applies-to: version-updates
        patterns:
          - "*"

  # ---------------------------------------------------------- GitHub Actions
  # Actions are pinned by full commit SHA with the tag in a same-line comment
  # (`uses: owner/action@<sha> # vX.Y.Z`); Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels: []
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
