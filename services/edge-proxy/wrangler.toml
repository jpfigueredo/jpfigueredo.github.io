name = "edge-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Every setting below is explicit on purpose: when a key is missing, wrangler 4
# (or the Cloudflare API) picks the default, and some of those defaults changed
# in wrangler 4. Keys and defaults: node_modules/wrangler/config-schema.json.

# workers.dev is this Worker's only URL today (there are no `routes`), so it
# stays on. Moving to a Custom Domain is a separate change.
workers_dev = true

# No per-version Preview URLs (<version>-edge-proxy.<subdomain>.workers.dev).
# Deploys use `wrangler deploy`, nothing reads a preview, and each one would be
# one more public URL that proxies to the BFF. The schema lists a default of
# `false`, but it does not apply here: when the key is missing, wrangler sends
# no value (undefined) and the API decides.
preview_urls = false

# Do not upload dist/index.js.map with the Worker (wrangler 4 does by default).
upload_source_maps = false

# No usage metrics to Cloudflare from any wrangler command run in this project
# (dev, build, deploy). The WRANGLER_SEND_METRICS environment variable, when
# set, still takes precedence.
send_metrics = false

# Do not send the project's dependency list (`package_dependencies`) in the
# upload metadata.
[dependencies_instrumentation]
enabled = false

# Workers Logs. Without this block, every `wrangler deploy` sends
# `observability: { enabled: false }` to the script settings and turns off
# logs that were enabled in the dashboard, so the settings live here.
#
# This Worker proxies /api/ requests that carry `Authorization` and `Cookie`.
# Invocation logs (one automatic log per request, with request and response
# details) stay off: Cloudflare does not document which request fields they
# store, so they are not trusted with credentials. Instead, src/index.ts
# writes one JSON line per /api/ request with an allowlist of fields: method,
# path without the query string, status, reason and upstream_ms. Never log
# headers, cookies, IP, user agent, query strings, bodies or error messages
# (the tests check that marked credentials do not reach the log). Turning
# invocation logs on is a separate, reviewed change.
[observability]
enabled = true
# Keep every log (low traffic).
head_sampling_rate = 1
# If a request URL reaches a log or trace, store it without the query string.
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
# Stored by Cloudflare and queryable in the dashboard (the schema default).
persist = true
# No export to other destinations (OpenTelemetry).
destinations = []

# Traces (spans for each request and its subrequests to the BFF): not needed.
[observability.traces]
enabled = false

# Workers Issues (grouping of production errors): off until what it stores is
# reviewed.
[observability.issues]
enabled = false

# Placeholder: with it, /api/ answers 503 (the Worker refuses placeholder and
# invalid hosts). The deploy sets the real host with --var.
[vars]
BFF_HOST = "api.example.com"
